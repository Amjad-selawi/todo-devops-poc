# Run the whole app locally:  docker compose up -d --build
# Open:                       http://localhost:8080
# Stop and delete:            docker compose down      (add -v to delete the database data too)

services:
  api:
    build:
      context: .
      args:
        APP_VERSION: local-compose
    image: todo-api:local
    ports:
      - "8080:8080"                       # HOST:CONTAINER
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=todos;Username=todo;Password=${DB_PASSWORD:-todo_pass}"
      App__Greeting: "Hello from Docker Compose"
      App__EnableChaos: "true"
    depends_on:
      db:
        condition: service_healthy        # start the API only after Postgres is ready
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container deletion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
