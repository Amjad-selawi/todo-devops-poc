# Apply everything in the right order with one command:
#   kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 10-postgres.yaml
  - 20-api-deployment.yaml
  - 21-api-service.yaml
  - 22-api-hpa.yaml
  - 23-api-pdb.yaml
  - 24-networkpolicy.yaml
