# NetworkPolicy: only the API Pods may connect to Postgres.
# Note: needs a CNI that enforces policies (Calico, Cilium). kind's default CNI ignores it,
# so on kind this file is accepted but not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-api-only
  namespace: todo
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: todo-api
      ports:
        - protocol: TCP
          port: 5432
