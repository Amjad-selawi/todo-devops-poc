# Secret = sensitive values (passwords, connection strings).
# WARNING (POC only): a Secret is base64-encoded, NOT encrypted, and should never be committed to Git
# in a real project. Use External Secrets Operator / Sealed Secrets / a vault instead.
apiVersion: v1
kind: Secret
metadata:
  name: todo-db-secret
  namespace: todo
type: Opaque
stringData:
  POSTGRES_DB: "todos"
  POSTGRES_USER: "todo"
  POSTGRES_PASSWORD: "todo_pass_change_me"
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=todos;Username=todo;Password=todo_pass_change_me"
